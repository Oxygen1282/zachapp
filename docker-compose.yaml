services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - ./backend:/app
      - invoice_files:/app/invoice_files
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      PYTHONPATH: /app/app
    depends_on:
      - db

  frontend:
    image: node:20 
    container_name: zachapp-frontend 
    working_dir: /app
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    command: sh -c "npm install && npm run build"
    depends_on:
      - backend

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: zachapp
    volumes:
      - zachapp-db-data:/var/lib/postgresql/data
  
  caddy:
    image: caddy:latest
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./frontend/dist:/srv                    # read the host's build directly
      - caddy-data:/data 
      - caddy-config:/config 
    depends_on:
      - backend
      - frontend

volumes:
  zachapp-db-data:
  caddy-data:
  caddy-config:
  node_modules:
  invoice_files: